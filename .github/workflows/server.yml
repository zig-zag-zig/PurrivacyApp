name: Purrivacy API CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
    paths:
      - 'apps/server/**'
      - 'packages/shared/**'
      - '.github/workflows/server.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: purrivacy-server-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-test:
    name: npm ci / build / test / docker image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    outputs:
      image-ref: ${{ steps.image.outputs.image_ref }}
      should-ship: ${{ steps.gate.outputs.should_ship }}
      version: ${{ steps.gate.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/server/package-lock.json
            packages/shared/package-lock.json

      - name: Setup Java 21 (Firebase emulators)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build @purrivacy/shared
        run: |
          npm install --no-audit --no-fund --prefix ../../packages/shared
          npm run build --prefix ../../packages/shared

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Knip dead-code check
        run: npx --yes knip@5

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Release gate (deploy only on version bump)
        id: gate
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail
          git fetch --tags origin --force >/dev/null 2>&1 || true
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Purrivacy production deploys run from main only." >&2
            exit 2
          fi

          version="$(node -p "require('./apps/server/package.json').version || '0.0.0'")"
          last_tag="$(git tag --list 'server-v*' --sort=-v:refname | head -1 || true)"

          if [[ -n "$last_tag" ]] && [[ "$(git tag --list "server-v${version}")" ]]; then
            echo "Version ${version} already released (${last_tag}); skipping deploy."
            echo "should_ship=false" >> "$GITHUB_OUTPUT"
          else
            if [[ -n "$last_tag" ]]; then
              echo "Version bump detected: ${last_tag#server-v} -> ${version}"
            else
              echo "No server-v* tag found — first tracked release: server-v${version}"
            fi
            echo "should_ship=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Docker image tags
        id: image
        if: steps.gate.outputs.should_ship == 'true'
        run: |
          set -Eeuo pipefail

          image_repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_ref="${image_repo}:sha-${GITHUB_SHA}"

          echo "image_repo=$image_repo" >> "$GITHUB_OUTPUT"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "environment_ref=${image_repo}:prod" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: steps.image.outputs.image_ref != ''
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build Docker image (PR validation only)
        if: steps.image.outputs.image_ref == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          tags: purrivacy-ci
          cache-from: type=gha,scope=purrivacy-api
          cache-to: type=gha,scope=purrivacy-api,mode=max

      - name: Build and push Docker image
        if: steps.image.outputs.image_ref != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image_ref }}
            ${{ steps.image.outputs.environment_ref }}
          cache-from: type=gha,scope=purrivacy-api
          cache-to: type=gha,scope=purrivacy-api,mode=max

  deploy:
    name: Deploy ${{ github.ref_name }}
    needs: build-test
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.build-test.outputs.should-ship == 'true'
    environment:
      name: production
    permissions:
      contents: write

    steps:
      - name: Materialize prod secret files (decode + verify runner-side)
        env:
          PURRIVACY_ENV_FILE_B64: ${{ secrets.PURRIVACY_ENV_FILE_B64 }}
          PURRIVACY_FIREBASE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.PURRIVACY_FIREBASE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          set -Eeuo pipefail
          dir="$RUNNER_TEMP/purrivacy-prod-secrets"
          install -d -m 700 "$dir"
          decode() {
            local name="$1" dest="$2" val="$3"
            if [[ -z "$val" ]]; then
              echo "::error::Missing GitHub environment secret $name" >&2
              exit 1
            fi
            if ! printf '%s' "$val" | base64 -d > "$dest" 2> "$dir/.err"; then
              echo "::error::Secret $name is not valid base64: $(cat "$dir/.err") (length=${#val})" >&2
              exit 1
            fi
            if [[ ! -s "$dest" ]]; then
              echo "::error::Secret $name decoded to an empty file" >&2
              exit 1
            fi
            echo "$name -> $(wc -c < "$dest") bytes"
          }
          decode PURRIVACY_ENV_FILE_B64 "$dir/.env" "$PURRIVACY_ENV_FILE_B64"
          decode PURRIVACY_FIREBASE_SERVICE_ACCOUNT_JSON_B64 "$dir/firebase-service-account.json" "$PURRIVACY_FIREBASE_SERVICE_ACCOUNT_JSON_B64"
          rm -f "$dir/.err"

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.PURRIVACY_VPS_HOST }}
          VPS_USER: ${{ secrets.PURRIVACY_VPS_USER }}
          VPS_PORT: ${{ secrets.PURRIVACY_VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.PURRIVACY_VPS_SSH_KEY }}
          PURRIVACY_REPO_URL: ${{ vars.PURRIVACY_REPO_URL || format('https://github.com/{0}.git', github.repository) }}
          PURRIVACY_DEPLOY_BRANCH: ${{ github.ref_name }}
          PAWIFY_DEPLOY_IMAGE: ${{ needs.build-test.outputs.image-ref }}
          PURRIVACY_IMAGE_REGISTRY: ghcr.io
          PURRIVACY_IMAGE_REGISTRY_USER: ${{ github.actor }}
          PURRIVACY_IMAGE_REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          : "${VPS_HOST:?Missing GitHub secret PURRIVACY_VPS_HOST}"
          : "${VPS_USER:?Missing GitHub secret PURRIVACY_VPS_USER}"
          : "${VPS_SSH_KEY:?Missing GitHub secret PURRIVACY_VPS_SSH_KEY}"
          : "${PAWIFY_DEPLOY_IMAGE:?Missing built Docker image ref}"

          if [[ "$PURRIVACY_DEPLOY_BRANCH" != "main" ]]; then
            echo "Purrivacy production deploys must run from main, not $PURRIVACY_DEPLOY_BRANCH." >&2
            exit 2
          fi

          VPS_PORT="${VPS_PORT:-22}"
          SECRETS_SOURCE_DIR="$HOME/purrivacy-prod-secrets"
          rm -rf "$SECRETS_SOURCE_DIR"
          cp -r "$RUNNER_TEMP/purrivacy-prod-secrets" "$SECRETS_SOURCE_DIR"
          chmod 700 "$SECRETS_SOURCE_DIR"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/purrivacy_deploy_key
          chmod 600 ~/.ssh/purrivacy_deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

          scp -P "$VPS_PORT" -i ~/.ssh/purrivacy_deploy_key -r "$SECRETS_SOURCE_DIR" \
            "$VPS_USER@$VPS_HOST:/home/$VPS_USER/purrivacy-prod-secrets"

          remote_repo_url="$(printf '%q' "$PURRIVACY_REPO_URL")"
          remote_branch="$(printf '%q' "$PURRIVACY_DEPLOY_BRANCH")"
          remote_prod_secret_source_dir="$(printf '%q' "/home/$VPS_USER/purrivacy-prod-secrets")"
          remote_deploy_image="$(printf '%q' "$PAWIFY_DEPLOY_IMAGE")"
          remote_image_registry="$(printf '%q' "ghcr.io")"
          remote_image_registry_user="$(printf '%q' "$GITHUB_ACTOR")"
          remote_image_registry_token="$(printf '%q' "${{ github.token }}")"

          ssh -p "$VPS_PORT" -i ~/.ssh/purrivacy_deploy_key "$VPS_USER@$VPS_HOST" \
            "PURRIVACY_REPO_URL=$remote_repo_url PURRIVACY_DEPLOY_BRANCH=$remote_branch PURRIVACY_SECRET_SOURCE_DIR=$remote_prod_secret_source_dir PURRIVACY_DEPLOY_IMAGE=$remote_deploy_image PURRIVACY_IMAGE_REGISTRY=$remote_image_registry PURRIVACY_IMAGE_REGISTRY_USER=$remote_image_registry_user PURRIVACY_IMAGE_REGISTRY_TOKEN=$remote_image_registry_token bash -se" <<'REMOTE'
          set -Eeuo pipefail

          if [[ "$PURRIVACY_DEPLOY_BRANCH" != "main" ]]; then
            echo "Unsupported deploy branch: $PURRIVACY_DEPLOY_BRANCH" >&2
            exit 2
          fi

          tmp_dir="$(mktemp -d)"
          cleanup() { rm -rf "$tmp_dir"; }
          trap cleanup EXIT

          git clone --depth 1 --branch "$PURRIVACY_DEPLOY_BRANCH" "$PURRIVACY_REPO_URL" "$tmp_dir"

          sudo bash "$tmp_dir/apps/server/scripts/deploy_purrivacy_docker.sh" \
            --repo-url "$PURRIVACY_REPO_URL" \
            --repo-branch "$PURRIVACY_DEPLOY_BRANCH" \
            --prebuilt-image "$PURRIVACY_DEPLOY_IMAGE" \
            --secrets-source-dir "$PURRIVACY_SECRET_SOURCE_DIR"
          REMOTE

      - name: Checkout (for release tag)
        if: success()
        uses: actions/checkout@v4

      - name: Tag released version
        if: success()
        run: |
          set -Eeuo pipefail
          version="${{ needs.build-test.outputs.version }}"
          git tag "server-v${version}" "${{ github.sha }}"
          git push origin "server-v${version}"
          echo "Tagged server-v${version}"
