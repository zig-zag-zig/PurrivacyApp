name: CI and Deploy Purrivacy

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: purrivacy-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-test:
    name: npm ci / build / test / docker image
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.image.outputs.image_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build app
        run: npm run build

      - name: Knip dead-code check
        # Blocking hygiene gate (API-ARCH-004): knip@5 reports 0 findings on
        # the current baseline (knip.json ignoreIssues covers test-consumed
        # exports). Fail the build if dead code/imports regress.
        run: npx --yes knip@5

      - name: Production dependency audit
        # Blocking: fail the build on high/critical vulnerabilities in the
        # production dependency tree.
        run: npm audit --omit=dev --audit-level=high

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare Docker image tags
        id: image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -Eeuo pipefail

          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Purrivacy production deploys must run from main, not $GITHUB_REF_NAME." >&2
            exit 2
          fi

          image_repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_ref="${image_repo}:sha-${GITHUB_SHA}"

          echo "image_repo=$image_repo" >> "$GITHUB_OUTPUT"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "environment_ref=${image_repo}:prod" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: steps.image.outputs.image_ref != ''
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build Docker image
        if: steps.image.outputs.image_ref == ''
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: purrivacy-ci
          cache-from: type=gha,scope=purrivacy-api
          cache-to: type=gha,scope=purrivacy-api,mode=max

      - name: Build and push Docker image
        if: steps.image.outputs.image_ref != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image_ref }}
            ${{ steps.image.outputs.environment_ref }}
          cache-from: type=gha,scope=purrivacy-api
          cache-to: type=gha,scope=purrivacy-api,mode=max

  deploy:
    name: Deploy ${{ github.ref_name }}
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: production

    steps:
      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.PURRIVACY_VPS_HOST }}
          VPS_USER: ${{ secrets.PURRIVACY_VPS_USER }}
          VPS_PORT: ${{ secrets.PURRIVACY_VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.PURRIVACY_VPS_SSH_KEY }}
          PURRIVACY_REPO_URL: ${{ vars.PURRIVACY_REPO_URL || format('https://github.com/{0}.git', github.repository) }}
          PURRIVACY_DEPLOY_BRANCH: ${{ github.ref_name }}
          PURRIVACY_SECRET_SOURCE_DIR: ${{ vars.PURRIVACY_SECRET_SOURCE_DIR }}
          PURRIVACY_ENV_FILE_B64: ${{ secrets.PURRIVACY_ENV_FILE_B64 }}
          PURRIVACY_FIREBASE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.PURRIVACY_FIREBASE_SERVICE_ACCOUNT_JSON_B64 }}
          PURRIVACY_DEPLOY_IMAGE: ${{ needs.build-test.outputs.image-ref }}
          PURRIVACY_IMAGE_REGISTRY: ghcr.io
          PURRIVACY_IMAGE_REGISTRY_USER: ${{ github.actor }}
          PURRIVACY_IMAGE_REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          : "${VPS_HOST:?Missing GitHub secret PURRIVACY_VPS_HOST}"
          : "${VPS_USER:?Missing GitHub secret PURRIVACY_VPS_USER}"
          : "${VPS_SSH_KEY:?Missing GitHub secret PURRIVACY_VPS_SSH_KEY}"
          : "${PURRIVACY_REPO_URL:?Missing PURRIVACY_REPO_URL}"
          : "${PURRIVACY_DEPLOY_BRANCH:?Missing PURRIVACY_DEPLOY_BRANCH}"
          : "${PURRIVACY_DEPLOY_IMAGE:?Missing built Docker image ref}"
          : "${PURRIVACY_ENV_FILE_B64:?Missing GitHub environment secret PURRIVACY_ENV_FILE_B64}"
          : "${PURRIVACY_FIREBASE_SERVICE_ACCOUNT_JSON_B64:?Missing GitHub environment secret PURRIVACY_FIREBASE_SERVICE_ACCOUNT_JSON_B64}"

          if [[ "$PURRIVACY_DEPLOY_BRANCH" != "main" ]]; then
            echo "Purrivacy production deploys must run from main, not $PURRIVACY_DEPLOY_BRANCH." >&2
            exit 2
          fi

          VPS_PORT="${VPS_PORT:-22}"
          PURRIVACY_SECRET_SOURCE_DIR="${PURRIVACY_SECRET_SOURCE_DIR:-/root/purrivacy-secrets}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/purrivacy_deploy_key
          chmod 600 ~/.ssh/purrivacy_deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

          remote_repo_url="$(printf '%q' "$PURRIVACY_REPO_URL")"
          remote_branch="$(printf '%q' "$PURRIVACY_DEPLOY_BRANCH")"
          remote_secret_source_dir="$(printf '%q' "$PURRIVACY_SECRET_SOURCE_DIR")"
          remote_env_file_b64="$(printf '%q' "$PURRIVACY_ENV_FILE_B64")"
          remote_firebase_service_account_json_b64="$(printf '%q' "$PURRIVACY_FIREBASE_SERVICE_ACCOUNT_JSON_B64")"
          remote_deploy_image="$(printf '%q' "$PURRIVACY_DEPLOY_IMAGE")"
          remote_image_registry="$(printf '%q' "$PURRIVACY_IMAGE_REGISTRY")"
          remote_image_registry_user="$(printf '%q' "$PURRIVACY_IMAGE_REGISTRY_USER")"
          remote_image_registry_token="$(printf '%q' "$PURRIVACY_IMAGE_REGISTRY_TOKEN")"

          ssh -p "$VPS_PORT" -i ~/.ssh/purrivacy_deploy_key "$VPS_USER@$VPS_HOST" \
            "PURRIVACY_REPO_URL=$remote_repo_url PURRIVACY_DEPLOY_BRANCH=$remote_branch PURRIVACY_SECRET_SOURCE_DIR=$remote_secret_source_dir PURRIVACY_ENV_FILE_B64=$remote_env_file_b64 PURRIVACY_FIREBASE_SERVICE_ACCOUNT_JSON_B64=$remote_firebase_service_account_json_b64 PURRIVACY_DEPLOY_IMAGE=$remote_deploy_image PURRIVACY_IMAGE_REGISTRY=$remote_image_registry PURRIVACY_IMAGE_REGISTRY_USER=$remote_image_registry_user PURRIVACY_IMAGE_REGISTRY_TOKEN=$remote_image_registry_token bash -se" <<'REMOTE'
          set -Eeuo pipefail

          require_apt_get() {
            if ! command -v apt-get >/dev/null 2>&1; then
              echo "apt-get is unavailable. Install missing deploy prerequisites on the VPS before deploying." >&2
              exit 1
            fi
          }

          if ! command -v sudo >/dev/null 2>&1; then
            if [[ "$(id -u)" == "0" ]]; then
              require_apt_get
              apt-get update
              apt-get install -y sudo
            else
              echo "sudo is missing on the VPS. Install sudo or deploy as root." >&2
              exit 1
            fi
          fi

          if ! sudo -n true; then
            echo "The deploy SSH user must have passwordless sudo, or PURRIVACY_VPS_USER must be root." >&2
            exit 1
          fi

          if ! command -v git >/dev/null 2>&1; then
            require_apt_get
            sudo apt-get update
            sudo apt-get install -y git ca-certificates
          fi

          write_b64_file() {
            local encoded="$1"
            local path="$2"
            local label="$3"
            local tmp

            if [[ -z "$encoded" ]]; then
              echo "Missing GitHub environment secret: $label" >&2
              exit 1
            fi

            tmp="$(mktemp)"
            if ! printf '%s' "$encoded" | base64 -d > "$tmp"; then
              rm -f "$tmp"
              echo "Could not base64-decode GitHub environment secret: $label" >&2
              exit 1
            fi

            sudo install -d -m 0700 "$(dirname "$path")"
            sudo install -m 0600 "$tmp" "$path"
            rm -f "$tmp"
          }

          write_b64_file "$PURRIVACY_ENV_FILE_B64" "$PURRIVACY_SECRET_SOURCE_DIR/.env" PURRIVACY_ENV_FILE_B64
          write_b64_file "$PURRIVACY_FIREBASE_SERVICE_ACCOUNT_JSON_B64" "$PURRIVACY_SECRET_SOURCE_DIR/firebase-service-account.json" PURRIVACY_FIREBASE_SERVICE_ACCOUNT_JSON_B64

          tmp_dir="$(mktemp -d)"
          cleanup() {
            rm -rf "$tmp_dir"
          }
          trap cleanup EXIT

          git clone --depth 1 --branch "$PURRIVACY_DEPLOY_BRANCH" "$PURRIVACY_REPO_URL" "$tmp_dir"

          sudo bash "$tmp_dir/scripts/deploy_purrivacy_docker.sh" \
            --repo-url "$PURRIVACY_REPO_URL" \
            --repo-branch "$PURRIVACY_DEPLOY_BRANCH" \
            --prebuilt-image "$PURRIVACY_DEPLOY_IMAGE" \
            --secrets-source-dir "$PURRIVACY_SECRET_SOURCE_DIR"
          REMOTE
