appId: vip.chi_chi.purrivacy
env:
  TEST_USERNAME: ${E2E_USERNAME}sv
  ACCOUNT_PASSWORD: Purrivacy-e2e-password-123
  WRONG_WORD: wrongword
---
# Error path: the signup seed-verification challenge must reject wrong words
# with an inline error (no account created), then accept the correct words
# and complete signup — the user is not locked out by the failed attempt.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "purrivacy.signin.username"
    timeout: 15000
- tapOn:
    id: "purrivacy.signin.signup"
- extendedWaitUntil:
    visible:
      id: "purrivacy.signup.username"
    timeout: 15000
- tapOn:
    id: "purrivacy.signup.username"
- inputText: ${TEST_USERNAME}
- tapOn:
    id: "purrivacy.signup.password"
- inputText: ${ACCOUNT_PASSWORD}
- tapOn:
    id: "purrivacy.signup.confirmPassword"
- inputText: ${ACCOUNT_PASSWORD}
- hideKeyboard
- tapOn:
    id: "purrivacy.signup.submit"
- runFlow:
    when:
      visible:
        id: "purrivacy.signup.submit"
    commands:
      - tapOn:
          id: "purrivacy.signup.submit"
- extendedWaitUntil:
    visible:
      id: "purrivacy.seed.saved"
    timeout: 30000
# Capture the seed words
- copyTextFrom:
    text: "^[a-z]+$"
    index: 0
- evalScript: ${output.sw1 = maestro.copiedText}
