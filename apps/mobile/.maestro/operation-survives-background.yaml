appId: vip.chi_chi.purrivacy
env:
  # A large file keeps the operation running across the background/foreground
  # transition instead of finishing before the app is backgrounded.
  E2E_SIZE_LABEL: "50MB"
---
# Regression: a long-running user operation (file encryption through the real
# WebView bridge) must survive the app going to background and being brought
# back, stay tracked by the OperationCenter, and finish with a verifiable
# result. Also guards against the inactivity lock firing on a short app switch
# while work is running.
- runFlow:
    file: subflows/login-shared.yaml
    env:
      FIXTURE_USERNAME: "e2e-shared"
      FIXTURE_PASSWORD: "Purrivacy-e2e-password-123"

- tapOn:
    id: "purrivacy.tab.encrypt"
- extendedWaitUntil:
    visible:
      id: "purrivacy.encrypt.screen"
    timeout: 15000
- tapOn:
    id: "purrivacy.encrypt.mode.file"
- tapOn:
    id: "purrivacy.encrypt.file.size.${E2E_SIZE_LABEL}"
- tapOn:
    id: "purrivacy.encrypt.file.pick"
- scrollUntilVisible:
    element:
      id: "purrivacy.encrypt.file.recipients.item.0"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "purrivacy.encrypt.file.recipients.item.0"
- scrollUntilVisible:
    element:
      id: "purrivacy.encrypt.file.run"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "purrivacy.encrypt.file.run"

# Confirm the operation is registered and running before backgrounding.
- extendedWaitUntil:
    visible:
      id: "purrivacy.ops.pill"
    timeout: 15000
- pressKey: Home
- assertNotVisible:
    id: "purrivacy.encrypt.screen"
- waitForAnimationToEnd:
    timeout: 5000
- launchApp:
    stopApp: false

# The vault must not have locked on a short background switch ...
- extendedWaitUntil:
    visible:
      id: "purrivacy.encrypt.screen"
    timeout: 15000
- assertNotVisible:
    id: "purrivacy.signin.username"

# ... and the operation must still be tracked (running pill) ...
- extendedWaitUntil:
    visible:
      id: "purrivacy.ops.pill"
    timeout: 15000

# ... and must complete with its result after returning to the foreground.
- scrollUntilVisible:
    element:
      id: "purrivacy.encrypt.file.sha256"
    direction: DOWN
    timeout: 300000
- assertVisible:
    id: "purrivacy.encrypt.file.sha256"