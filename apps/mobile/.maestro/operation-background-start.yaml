appId: vip.chi_chi.purrivacy
env:
  E2E_SIZE_LABEL: "50MB"
---
# Phase 1 of the long-background-dwell test: start a 50 MB file encryption,
# verify the OperationCenter pill is active, then press Home and confirm the
# encrypt screen is no longer visible. The runner then dwells for >120s (past
# the per-call WebView bridge timeout) before running the finish flow.
- runFlow:
    file: subflows/login-shared.yaml
    env:
      FIXTURE_USERNAME: "e2e-shared"
      FIXTURE_PASSWORD: "Purrivacy-e2e-password-123"

- tapOn:
    id: "purrivacy.tab.encrypt"
- extendedWaitUntil:
    visible:
      id: "purrivacy.encrypt.screen"
    timeout: 15000
- tapOn:
    id: "purrivacy.encrypt.mode.file"
- tapOn:
    id: "purrivacy.encrypt.file.size.${E2E_SIZE_LABEL}"
- tapOn:
    id: "purrivacy.encrypt.file.pick"
- scrollUntilVisible:
    element:
      id: "purrivacy.encrypt.file.recipients.item.0"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "purrivacy.encrypt.file.recipients.item.0"
- scrollUntilVisible:
    element:
      id: "purrivacy.encrypt.file.run"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "purrivacy.encrypt.file.run"

- extendedWaitUntil:
    visible:
      id: "purrivacy.ops.pill"
    timeout: 15000
- pressKey: Home
- assertNotVisible:
    id: "purrivacy.encrypt.screen"
