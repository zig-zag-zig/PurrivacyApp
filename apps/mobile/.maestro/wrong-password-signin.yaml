appId: vip.chi_chi.purrivacy
env:
  TEST_USERNAME: e2e-shared
  WRONG_PASSWORD: definitely-wrong-password-999
---
# Error path: wrong password for an EXISTING user must surface a clear 401
# error, stay on the signin screen, and must not crash or sign anything out.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "purrivacy.signin.username"
    timeout: 15000
- tapOn:
    id: "purrivacy.signin.username"
- inputText: ${TEST_USERNAME}
- tapOn:
    id: "purrivacy.signin.password"
- inputText: ${WRONG_PASSWORD}
- hideKeyboard
- tapOn:
    id: "purrivacy.signin.submit"
# Backend 401 -> "Sign in failed. Check your username and password and try again."
- extendedWaitUntil:
    visible: "Sign in failed. Check your username and password and try again."
    timeout: 30000
# Still on the signin screen, form intact, no session leaked in
- assertVisible:
    id: "purrivacy.signin.username"
- assertNotVisible:
    id: "purrivacy.key.screen"
