appId: vip.chi_chi.purrivacy
env:
  TEST_USERNAME: e2e-shared
  ACCOUNT_PASSWORD: Purrivacy-e2e-password-123
---
# Security: after sign-out, no sensitive state may leak into the next session
# on the device — a relaunch must land on the signin screen with no key
# material, and the account's keys must still come back after a fresh login.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "purrivacy.signin.username"
    timeout: 15000
- tapOn:
    id: "purrivacy.signin.username"
- inputText: ${TEST_USERNAME}
- tapOn:
    id: "purrivacy.signin.password"
- inputText: ${ACCOUNT_PASSWORD}
- hideKeyboard
- tapOn:
    id: "purrivacy.signin.submit"
- extendedWaitUntil:
    visible:
      id: "purrivacy.key.screen"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "purrivacy.key.item"
    timeout: 60000
# Sign out from settings
- tapOn:
    id: "purrivacy.tab.settings"
- extendedWaitUntil:
    visible:
      id: "purrivacy.settings.screen"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "purrivacy.settings.logout"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "purrivacy.settings.logout"
- extendedWaitUntil:
    visible:
      id: "purrivacy.signin.username"
    timeout: 30000
# Relaunch without clearing state: must NOT auto-resume the signed-out session
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "purrivacy.signin.username"
    timeout: 30000
- assertNotVisible:
    id: "purrivacy.key.item"
- assertNotVisible:
    id: "purrivacy.key.screen"
# Fresh login brings the server-synced keys back
- tapOn:
    id: "purrivacy.signin.username"
- inputText: ${TEST_USERNAME}
- tapOn:
    id: "purrivacy.signin.password"
- inputText: ${ACCOUNT_PASSWORD}
- hideKeyboard
- tapOn:
    id: "purrivacy.signin.submit"
- extendedWaitUntil:
    visible:
      id: "purrivacy.key.screen"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "purrivacy.key.item"
    timeout: 60000
