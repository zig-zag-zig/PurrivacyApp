appId: vip.chi_chi.purrivacy
env:
  TEST_USERNAME: e2e-shared
  ACCOUNT_PASSWORD: Purrivacy-e2e-password-123
---
# Security: "Revoke All Sessions" from this device must kill every other
# session. The runner (run-auxiliary-e2e.cjs) creates a second session via
# REST before this flow and verifies it returns 401 afterwards.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "purrivacy.signin.username"
    timeout: 15000
- tapOn:
    id: "purrivacy.signin.username"
- inputText: ${TEST_USERNAME}
- tapOn:
    id: "purrivacy.signin.password"
- inputText: ${ACCOUNT_PASSWORD}
- hideKeyboard
- tapOn:
    id: "purrivacy.signin.submit"
- extendedWaitUntil:
    visible:
      id: "purrivacy.key.screen"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "purrivacy.key.item"
    timeout: 60000
# Settings -> Revoke All Sessions -> confirm
- tapOn:
    id: "purrivacy.tab.settings"
- extendedWaitUntil:
    visible:
      id: "purrivacy.settings.screen"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Revoke All Sessions"
    direction: DOWN
    timeout: 15000
- tapOn: "Revoke All Sessions"
- extendedWaitUntil:
    visible: "This will log you out from all devices and revoke all active sessions. You'll need to sign in again on all devices."
    timeout: 15000
- tapOn: "Revoke"
# Success toast, then the app signs the local session out
- extendedWaitUntil:
    visible: "All sessions revoked successfully"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "purrivacy.signin.username"
    timeout: 30000
