appId: vip.chi_chi.purrivacy
env:
  TEST_USERNAME: ${E2E_USERNAME}bio
  ACCOUNT_PASSWORD: Purrivacy-e2e-password-123
---
# Sign up, create a key, then store passphrase and enable biometric
- runFlow:
    file: subflows/register-create-key.yaml
    env:
      TEST_USERNAME: ${TEST_USERNAME}
# Store passphrase
- tapOn:
    id: "purrivacy.passphraseStorage.store"
- extendedWaitUntil:
    visible:
      id: "purrivacy.key.item"
    timeout: 60000
# Navigate to settings
- tapOn:
    id: "purrivacy.tab.settings"
- extendedWaitUntil:
    visible:
      id: "purrivacy.settings.screen"
    timeout: 15000
# The Biometric Unlock row only renders when the device has biometrics
# enrolled (hardware + prints). Skip gracefully when unavailable.
- swipe:
    direction: UP
- extendedWaitUntil:
    visible:
      id: "purrivacy.settings.biometric"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: "purrivacy.settings.biometric"
    commands:
      - tapOn:
          id: "purrivacy.settings.biometric"
      - extendedWaitUntil:
          visible:
            id: "purrivacy.settings.biometric.enabled"
          timeout: 15000
          optional: true
# Sign out
- tapOn:
    id: "purrivacy.tab.settings"
- scrollUntilVisible:
    element:
      id: "purrivacy.settings.logout"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "purrivacy.settings.logout"
- extendedWaitUntil:
    visible:
      id: "purrivacy.signin.username"
    timeout: 15000
# Sign back in to verify biometric prompt appears
- tapOn:
    id: "purrivacy.signin.username"
- inputText: ${TEST_USERNAME}
- tapOn:
    id: "purrivacy.signin.password"
- inputText: ${ACCOUNT_PASSWORD}
- hideKeyboard
- tapOn:
    id: "purrivacy.signin.submit"
# After login, biometric prompt should appear if enabled
- runFlow:
    when:
      visible:
        id: "purrivacy.biometric.prompt"
    commands:
      - assertVisible:
          id: "purrivacy.biometric.prompt"
