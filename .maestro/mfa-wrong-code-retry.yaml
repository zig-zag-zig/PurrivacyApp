appId: vip.chi_chi.purrivacy
env:
  TEST_USERNAME: e2e-mfa
  ACCOUNT_PASSWORD: Purrivacy-e2e-password-123
---
# Sign in to the seeded MFA-enabled account; the MFA challenge modal appears.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "purrivacy.signin.username"
    timeout: 15000
- tapOn:
    id: "purrivacy.signin.username"
- inputText: ${TEST_USERNAME}
- tapOn:
    id: "purrivacy.signin.password"
- inputText: ${ACCOUNT_PASSWORD}
- hideKeyboard
- tapOn:
    id: "purrivacy.signin.submit"
# MFA modal should appear
- extendedWaitUntil:
    visible:
      id: "purrivacy.mfa.modal"
    timeout: 30000
# Submit a wrong code (tap a visible box to focus, then type — auto-submits at 6 digits)
- tapOn:
    id: "purrivacy.mfa.code.input.box.0"
- inputText: "000000"
# The backend rejects it (403 wrongMfaCode); the app clears the input and
# stays on the modal for retry. Wait for the clear, then assert still modal.
- extendedWaitUntil:
    visible:
      id: "purrivacy.mfa.modal"
    timeout: 15000
- assertVisible:
    id: "purrivacy.mfa.code.input.box.0"
# Cancel the modal (Android back; can't test real TOTP in E2E)
- pressKey: Back
# Should return to signin screen
- extendedWaitUntil:
    visible:
      id: "purrivacy.signin.username"
    timeout: 15000
