appId: vip.chi_chi.purrivacy
env:
  TEST_USERNAME: ${E2E_USERNAME}
  ACCOUNT_PASSWORD: Purrivacy-e2e-password-123
  FIRST_MESSAGE: passphrase autofill before relaunch
  SECOND_MESSAGE: passphrase autofill after relaunch
---
# Feature-completion: a stored key passphrase must survive an app relaunch and
# auto-fill on the next encrypt — no re-entry prompt, no error.
- launchApp:
    clearState: true
- runFlow:
    file: subflows/register-create-key-fixed.yaml
- tapOn:
    id: "purrivacy.passphraseStorage.store"
- extendedWaitUntil:
    visible:
      id: "purrivacy.key.item"
    timeout: 60000
# Encrypt with the freshly stored passphrase (pre-relaunch baseline)
- tapOn:
    id: "purrivacy.tab.encrypt"
- extendedWaitUntil:
    visible:
      id: "purrivacy.encrypt.screen"
    timeout: 15000
- tapOn:
    id: "purrivacy.encrypt.content"
- inputText: ${FIRST_MESSAGE}
- hideKeyboard
- tapOn:
    id: "purrivacy.encrypt.recipients.item.0"
- tapOn:
    id: "purrivacy.encrypt.submit"
- extendedWaitUntil:
    visible:
      id: "purrivacy.encrypt.result.text"
    timeout: 90000
# Relaunch WITHOUT clearing app state (session + stored passphrase persist)
- launchApp:
    clearState: false
# Relaunch restores the app to its LOCK screen ("Unlock with password":
# username shown as text, no username input). Unlock with the account password.
- runFlow:
    when:
      visible:
        id: "purrivacy.signin.submit"
      notVisible:
        id: "purrivacy.signin.username"
    commands:
      - tapOn:
          id: "purrivacy.signin.password"
      - inputText: ${ACCOUNT_PASSWORD}
      - hideKeyboard
      - tapOn:
          id: "purrivacy.signin.submit"
- runFlow:
    when:
      visible:
        id: "purrivacy.signin.username"
    commands:
      - tapOn:
          id: "purrivacy.signin.username"
      - inputText: ${TEST_USERNAME}
      - tapOn:
          id: "purrivacy.signin.password"
      - inputText: ${ACCOUNT_PASSWORD}
      - hideKeyboard
      - tapOn:
          id: "purrivacy.signin.submit"
# The app restores the last visited tab (encrypt); switch back to the key tab
- runFlow:
    when:
      visible:
        id: "purrivacy.encrypt.screen"
    commands:
      - tapOn:
          id: "purrivacy.tab.key"
- extendedWaitUntil:
    visible:
      id: "purrivacy.key.screen"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "purrivacy.key.item"
    timeout: 60000
# Encrypt again — the stored passphrase must auto-fill (if it did not, the
# submit would fail with a passphrase error and no result would appear)
- tapOn:
    id: "purrivacy.tab.encrypt"
- extendedWaitUntil:
    visible:
      id: "purrivacy.encrypt.screen"
    timeout: 15000
- tapOn:
    id: "purrivacy.encrypt.content"
- inputText: ${SECOND_MESSAGE}
- hideKeyboard
- tapOn:
    id: "purrivacy.encrypt.recipients.item.0"
- tapOn:
    id: "purrivacy.encrypt.submit"
- extendedWaitUntil:
    visible:
      id: "purrivacy.encrypt.result.text"
    timeout: 90000
- copyTextFrom:
    id: "purrivacy.encrypt.result.text"
- evalScript: ${output.afterRelaunch = maestro.copiedText}
- assertTrue:
    condition: ${output.afterRelaunch.includes('BEGIN PGP MESSAGE')}
    label: Encrypt succeeded after relaunch with the auto-filled stored passphrase
