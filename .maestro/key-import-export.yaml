---
# Sign up, create a key, then import a second key
- runFlow:
    file: subflows/register-create-key.yaml
    env:
      TEST_USERNAME: ${TEST_USERNAME}
- tapOn:
    id: "purrivacy.passphraseStorage.store"
- extendedWaitUntil:
    visible:
      id: "purrivacy.key.item"
    timeout: 60000
# Switch to Import tab and paste the public key
- tapOn:
    id: "purrivacy.key.action.import"
- tapOn:
    id: "purrivacy.key.import.armoredKey"
- inputText: ${IMPORT_PUBLIC_KEY}
- hideKeyboard
- tapOn:
    id: "purrivacy.key.import.submit"
# Verify imported key appears
- extendedWaitUntil:
    visible:
      id: "purrivacy.key.item"
    timeout: 30000
# Switch back to import and import the linked private key
# (wait for the post-import key reload / opaque spinner to settle)
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "purrivacy.key.action.import"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "purrivacy.key.import.armoredKey"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "purrivacy.key.import.armoredKey"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "purrivacy.key.import.armoredKey"
    retryTapIfNoChange: true
- waitForAnimationToEnd:
    timeout: 3000
# The import field is a security-isolated input that suppresses accessibility
# text, so Maestro's inputText can never verify completion. Paste via the
# device clipboard + KEYCODE_PASTE instead (key events work, no verification).
- inputText: ${IMPORT_PRIVATE_KEY}
- hideKeyboard
- tapOn:
    id: "purrivacy.key.import.submit"
# Verify now have at least 2 key items
- extendedWaitUntil:
    visible:
      id: "purrivacy.key.item"
    timeout: 30000
# Verify we are back on the key screen
- assertVisible:
    id: "purrivacy.key.screen"